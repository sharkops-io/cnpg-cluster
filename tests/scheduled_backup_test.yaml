suite: scheduled backup
templates:
  - scheduled-backup.yaml
tests:
  - it: should name backup after release
    release:
      name: zitadel-database
    asserts:
      - equal:
          path: metadata.name
          value: zitadel-database-backup

  - it: should point backup at the cluster (release name)
    release:
      name: zitadel-database
    asserts:
      - equal:
          path: spec.cluster.name
          value: zitadel-database

  - it: should use configured backup schedule
    set:
      backup.schedule: "0 3 0 * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "0 3 0 * * *"

  - it: should use barman-cloud plugin
    asserts:
      - equal:
          path: spec.pluginConfiguration.name
          value: barman-cloud.cloudnative-pg.io
