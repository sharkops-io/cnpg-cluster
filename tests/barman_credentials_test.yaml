suite: barman credentials
templates:
  - barman-credentials.yaml
tests:
  - it: should create an Opaque secret named barman-credentials
    set:
      backup.minio.accessKeyId: testkey123
      backup.minio.secretAccessKey: testsecret456
    asserts:
      - equal:
          path: metadata.name
          value: barman-credentials
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.access-key-id
          value: testkey123
      - equal:
          path: stringData.secret-access-key
          value: testsecret456

  # The two credential sources are mutually exclusive. If this regressed, the
  # chart would render BOTH a literal Secret and an ExternalSecret targeting
  # the same name - ESO would fight Helm over ownership and whichever wrote
  # last would win, intermittently.
  - it: should not create the literal secret when externalSecret is enabled
    set:
      backup.minio.accessKeyId: testkey123
      backup.minio.secretAccessKey: testsecret456
      backup.minio.externalSecret.enabled: true
    asserts:
      - hasDocuments:
          count: 0
