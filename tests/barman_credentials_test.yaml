suite: barman credentials
templates:
  - barman-credentials.yaml
tests:
  - it: should create an Opaque secret named barman-credentials
    set:
      backup.minio.accessKeyId: testkey123
      backup.minio.secretAccessKey: testsecret456
    asserts:
      - equal:
          path: metadata.name
          value: barman-credentials
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.access-key-id
          value: testkey123
      - equal:
          path: stringData.secret-access-key
          value: testsecret456
