suite: barman external secret
templates:
  - barman-external-secret.yaml
tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should produce a Secret named barman-credentials so the ObjectStore reference still resolves
    set:
      backup.minio.externalSecret.enabled: true
      backup.minio.externalSecret.remoteKey: infra/s3-backup
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: barman-credentials
      - equal:
          path: spec.target.name
          value: barman-credentials
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.target.deletionPolicy
          value: Retain

  # ESO 2.x serves v1 only; v1beta1 is `served: false` and the API server
  # REJECTS it rather than converting. Pinning this in a test because most
  # examples online are still v1beta1 and it is an easy regression.
  - it: should use the v1 API, never v1beta1
    set:
      backup.minio.externalSecret.enabled: true
      backup.minio.externalSecret.remoteKey: infra/s3-backup
    asserts:
      - isAPIVersion:
          of: external-secrets.io/v1

  # remoteKey has no default: a guessed path would only fail later, at ESO
  # sync time, as a SecretSyncedError the Helm release never sees.
  - it: should fail to render when enabled without a remoteKey
    set:
      backup.minio.externalSecret.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "backup.minio.externalSecret.remoteKey is required"

  - it: should point both keys at the configured remote path
    set:
      backup.minio.externalSecret.enabled: true
      backup.minio.externalSecret.remoteKey: infra/s3-backup
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: access-key-id
      - equal:
          path: spec.data[0].remoteRef.key
          value: infra/s3-backup
      - equal:
          path: spec.data[0].remoteRef.property
          value: access-key-id
      - equal:
          path: spec.data[1].secretKey
          value: secret-access-key
      - equal:
          path: spec.data[1].remoteRef.key
          value: infra/s3-backup
      - equal:
          path: spec.data[1].remoteRef.property
          value: secret-access-key

  - it: should allow overriding the store and property names
    set:
      backup.minio.externalSecret.enabled: true
      backup.minio.externalSecret.remoteKey: apps/somewhere-else
      backup.minio.externalSecret.accessKeyIdProperty: AWS_ACCESS_KEY_ID
      backup.minio.externalSecret.secretAccessKeyProperty: AWS_SECRET_ACCESS_KEY
      backup.minio.externalSecret.refreshInterval: 15m
      backup.minio.externalSecret.secretStoreRef.name: other-store
      backup.minio.externalSecret.secretStoreRef.kind: SecretStore
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 15m
      - equal:
          path: spec.secretStoreRef.name
          value: other-store
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.data[0].remoteRef.property
          value: AWS_ACCESS_KEY_ID
      - equal:
          path: spec.data[1].remoteRef.property
          value: AWS_SECRET_ACCESS_KEY
      # The Secret's own key names are fixed by the ObjectStore and must NOT
      # follow the remote property names.
      - equal:
          path: spec.data[0].secretKey
          value: access-key-id
      - equal:
          path: spec.data[1].secretKey
          value: secret-access-key
