suite: wal switch cronjob
templates:
  - wal-switch-cronjob.yaml
  - wal-switch-role.yaml
  - wal-switch-serviceaccount.yaml
  - wal-switch-rolebinding.yaml
  - wal-switch-configmap.yaml
tests:
  - it: should use release name as the cluster name env var
    release:
      name: coder-database
    template: wal-switch-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].value
          value: coder-database

  - it: should default to once daily, an hour after the default backup
    template: wal-switch-cronjob.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "0 1 * * *"

  - it: should use configured schedule
    set:
      walSwitch.schedule: "*/5 * * * *"
    template: wal-switch-cronjob.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "*/5 * * * *"

  - it: should render nothing when disabled
    set:
      walSwitch.enabled: false
    templates:
      - wal-switch-cronjob.yaml
      - wal-switch-role.yaml
      - wal-switch-serviceaccount.yaml
      - wal-switch-rolebinding.yaml
      - wal-switch-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  # BOTH verbs are asserted deliberately. `create` alone still execs -- kubectl
  # falls back to SPDY -- so a regression that drops `get` would pass every
  # functional check and only show up as a 403 per run in the audit log.
  - it: should grant pods/exec get and create on the role
    template: wal-switch-role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/exec"]
            verbs: ["get", "create"]

  - it: should not run as root
    template: wal-switch-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
