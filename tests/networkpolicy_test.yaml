suite: networkpolicy
templates:
  - networkpolicy.yaml
tests:
  - it: renders nothing when disabled
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: selects every pod of this cluster
    release:
      name: wikijs-database
      namespace: wikijs
    set:
      networkPolicy:
        enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: wikijs-database-database
      - equal:
          path: spec.podSelector.matchLabels["cnpg.io/cluster"]
          value: wikijs-database
      - equal:
          path: spec.policyTypes
          value: ["Ingress"]

  # The operator dials INTO the instance manager on :8000. No values file
  # states this anywhere -- it was found in Hubble flows. Without it the
  # operator loses the ability to manage this cluster.
  - it: allows the operator on 8000 and 5432
    release:
      name: wikijs-database
      namespace: wikijs
    set:
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: cnpg-system
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8000
      - equal:
          path: spec.ingress[0].ports[1].port
          value: 5432

  - it: allows streaming replication between this cluster's instances
    release:
      name: wikijs-database
      namespace: wikijs
    set:
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["cnpg.io/cluster"]
          value: wikijs-database
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 5432

  - it: allows named application pods on 5432
    release:
      name: wikijs-database
      namespace: wikijs
    set:
      networkPolicy:
        enabled: true
        allowFromPods:
          - matchLabels:
              app.kubernetes.io/name: wiki
    asserts:
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: wiki
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 5432

  - it: always allows prometheus on the metrics port
    release:
      name: wikijs-database
      namespace: wikijs
    set:
      networkPolicy:
        enabled: true
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
            ports:
              - port: 9187
                protocol: TCP

  - it: never emits an egress block
    set:
      networkPolicy:
        enabled: true
    asserts:
      - notExists:
          path: spec.egress

  # CROSS-NAMESPACE clients. A shared pgadmin administers every database from
  # its own namespace, so it matches no allowFromPods entry and is silently
  # blocked from every CNPG cluster once default-deny lands.
  - it: allows a cross-namespace client on 5432
    set:
      networkPolicy:
        enabled: true
        allowFromNamespacedPods:
          - namespace: pgadmin
            podSelector:
              matchLabels:
                app.kubernetes.io/name: pgadmin
    asserts:
      # THE WHOLE POINT: both selectors in ONE `from` entry so they AND.
      # As two entries Kubernetes would OR them, admitting this pod label from
      # ANY namespace -- wider than intended while still looking correct.
      - lengthEqual:
          path: spec.ingress[2].from
          count: 1
      - equal:
          path: spec.ingress[2].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: pgadmin
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: pgadmin
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 5432

  # The same-namespace form must stay same-namespace. If a namespaceSelector
  # ever leaked into it, every allowFromPods entry in every release would
  # silently widen to all namespaces.
  - it: keeps allowFromPods scoped to the local namespace
    set:
      networkPolicy:
        enabled: true
        allowFromPods:
          - matchLabels:
              app.kubernetes.io/name: wiki
    asserts:
      - notExists:
          path: spec.ingress[2].from[0].namespaceSelector
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: wiki

  - it: emits no cross-namespace rule when the list is empty
    set:
      networkPolicy:
        enabled: true
    asserts:
      # operator, replication, prometheus -- and nothing else.
      - lengthEqual:
          path: spec.ingress
          count: 3
