cluster:
  instances: 2
  enableSuperuserAccess: false
  storage:
    size: 10Gi
    class: longhorn-postgres-replica-storage-besteffort
  postgresql:
    major: 18
    # CNPG defaults archive_timeout to 5min, which forces a WAL switch every
    # five minutes on any cluster with activity. On low-traffic databases that
    # is almost pure overhead: each switch archives a full 16 MiB segment, so
    # five clusters can produce ~10,000 objects per 7-day retention window - the
    # dominant source of object count in the backup bucket, ~3x what the
    # wal-switch CronJob contributes.
    #
    # 30m keeps a sane recovery point for a small deployment while cutting that
    # ~6x.
    # Raise it further for genuinely idle databases; lower it if you need a
    # tighter RPO on an active one. Note this only fires when there HAS been
    # write activity - a fully idle database switches nothing either way,
    # which is what the wal-switch CronJob exists to cover.
    archiveTimeout: 30min

backup:
  schedule: "0 2 0 * * *"
  minio:
    # S3 endpoint URL, e.g. https://s3.example.com. Set it for any
    # S3-compatible store (MinIO, RustFS, Ceph RGW, ...). Leave it empty only
    # for AWS S3 itself: endpointURL is then omitted and Barman uses its
    # default AWS endpoint.
    endpoint: ""
    bucket: pg-backups

    # Two ways to supply the S3 credentials. Either way the chart ends up with
    # a Secret named `barman-credentials` holding `access-key-id` and
    # `secret-access-key`, which is what the ObjectStore references - so
    # switching between them changes nothing downstream.
    #
    # 1. Literals below. Simple, but the value lands in the consuming repo's
    #    values file and therefore in git. With several clusters the SAME key
    #    pair tends to get copy-pasted into every one of them, so rotating it
    #    means editing every repo and running every deploy - which is exactly
    #    why it never gets rotated.
    #
    # 2. externalSecret below. The value lives once in a secret store (e.g.
    #    OpenBao or Vault) and ESO materialises it into each namespace.
    #    Rotation becomes a single write to the store that every consumer
    #    picks up. PREFER THIS.
    accessKeyId: ""
    secretAccessKey: ""

    externalSecret:
      # When enabled, the chart renders an ExternalSecret INSTEAD OF a literal
      # Secret, and accessKeyId/secretAccessKey above are ignored.
      enabled: false
      # Path of the secret in your store, e.g. `infra/s3-backup`. Required
      # when enabled.
      remoteKey: ""
      accessKeyIdProperty: access-key-id
      secretAccessKeyProperty: secret-access-key
      refreshInterval: 1h
      secretStoreRef:
        name: openbao
        # ClusterSecretStore, not SecretStore - one store serves every
        # namespace, so each cluster does not need its own.
        kind: ClusterSecretStore
  retentionPolicy: "7d"

walSwitch:
  enabled: true
  # Mitigates cloudnative-pg/plugin-barman-cloud#652 (still open as of
  # 2026-07-31): archive_timeout doesn't reliably force a WAL switch on an
  # idle/low-write database, so a "completed" backup can end up unrestorable
  # (FATAL: WAL ends before end of online backup) because the WAL segment
  # needed to close it out never gets archived. Backups run against a standby
  # and CNPG does not switch the WAL on the primary for those, so this forces
  # it regardless of write volume.
  #
  # The switch is only NEEDED after a backup completes, so it runs once a day,
  # an hour after the default backup.schedule ("0 2 0 * * *" = 00:02:00). The
  # previous "*/15 * * * *" default fired 96 times a day for a once-daily
  # backup: each switch forces a full 16 MiB WAL segment per cluster, roughly
  # 1.5 GiB/day per cluster, against backups that typically complete in under
  # 20 s.
  #
  # !! If you override backup.schedule, override this too. !!
  # They are deliberately NOT derived from each other: cron arithmetic in Helm
  # (including minute overflow into the next hour) could produce a schedule that
  # silently never fires after a backup, which means unrestorable backups — a
  # far worse failure than some wasted writes. Keep this comfortably after the
  # backup starts; an hour is generous for backups that finish in seconds.
  #
  # Note the two use different cron dialects: backup.schedule is CNPG's 6-field
  # form (seconds first), this is a standard 5-field Kubernetes CronJob.
  schedule: "0 1 * * *"
  image:
    # kubectl's skew policy only supports clients within ~1 minor version of
    # the apiserver, so override this to track your cluster's Kubernetes
    # version rather than letting it drift behind.
    repository: docker.io/alpine/k8s
    tag: "1.37.2"

# Ingress policy for THIS cluster's database pods. Off by default so existing
# releases are unaffected until they opt in.
networkPolicy:
  enabled: false
  # Label selectors for the application pods allowed to reach postgres on
  # 5432. The app is usually the only client.
  #
  # SAME NAMESPACE ONLY. A `from` entry with only a podSelector is scoped to
  # this policy's namespace by Kubernetes. Listing a label here does NOT admit a
  # pod of that name from elsewhere -- for that, use allowFromNamespacedPods.
  allowFromPods: []
    # - matchLabels:
    #     app.kubernetes.io/name: wiki

  # Cross-namespace clients on 5432. A shared admin tool such as pgadmin is the
  # typical case: it reaches every database from its own namespace, so it
  # matches no `allowFromPods` entry and is silently blocked from EVERY CNPG
  # cluster once default-deny lands. The block is invisible -- the databases
  # report "Cluster in healthy state" throughout, because nothing they do
  # depends on pgadmin.
  #
  # Renders namespaceSelector AND podSelector inside ONE `from` entry so they
  # AND together. Do not split them: `from` entries are OR'd.
  allowFromNamespacedPods: []
    # - namespace: pgadmin
    #   podSelector:
    #     matchLabels:
    #       app.kubernetes.io/name: pgadmin
