{{- if .Values.walSwitch.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-wal-switch
  namespace: {{ .Release.Namespace }}
rules:
  # Needed to find whichever pod currently holds the primary role - can't be
  # scoped by resourceNames since the primary pod's name changes across
  # failovers. Blast radius is contained to this one namespace, where the
  # only pods are this cluster's own instances and this job's own completed
  # pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # BOTH verbs, and `get` is not optional padding. kubectl tries the
  # WebSocket exec path first, which is a GET on pods/exec; only when that is
  # refused does it fall back to SPDY, which is the POST that `create` covers.
  # With `create` alone the WAL switch still works -- via the fallback -- so
  # nothing ever looked broken, while every run left a 403 in the apiserver
  # audit log (2 per cluster per 24h). Granting `get` removes the denial and
  # lets the modern path succeed on the first attempt.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
{{- end }}
