{{- if .Values.backup.minio.externalSecret.enabled }}
{{- $es := .Values.backup.minio.externalSecret }}
# Materialises the same `barman-credentials` Secret the literal path produces,
# so templates/objectstore.yaml needs no knowledge of where the value came
# from. The point is that the credential exists ONCE, in OpenBao, rather than
# copy-pasted into every consuming repo.
#
# external-secrets.io/v1 - NOT v1beta1. ESO 2.x ships v1beta1 as
# `served: false`, so the API server rejects those manifests outright rather
# than converting them, and most examples online are still v1beta1.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barman-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: barman-credentials
    creationPolicy: Owner
    # Retain: losing the Helm release should not take the backup credentials
    # with it while a restore is in progress.
    deletionPolicy: Retain
  # Explicit data entries rather than dataFrom, because the Secret's key names
  # (access-key-id / secret-access-key) are fixed by the ObjectStore reference
  # and must not track whatever the bao properties happen to be called.
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $es.accessKeyIdProperty }}
    - secretKey: secret-access-key
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $es.secretAccessKeyProperty }}
{{- end }}
