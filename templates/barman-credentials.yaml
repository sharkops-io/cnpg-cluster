{{- if not .Values.backup.minio.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: barman-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .Values.backup.minio.accessKeyId | quote }}
  secret-access-key: {{ .Values.backup.minio.secretAccessKey | quote }}
{{- end }}
