apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-store
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-cluster.labels" . | nindent 4 }}
spec:
  configuration:
    destinationPath: s3://{{ .Values.backup.minio.bucket }}
    {{- with .Values.backup.minio.endpoint }}
    endpointURL: {{ . }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: barman-credentials
        key: access-key-id
      secretAccessKey:
        name: barman-credentials
        key: secret-access-key
    wal:
      compression: gzip
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
